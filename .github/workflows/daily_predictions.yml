name: Daily Predictor

on:
  schedule:
    - cron: "0 16 * * *"    # UTC idő! Ha 17:00 kell magyar idő szerint → 16:00 UTC
  workflow_dispatch:         # manuális indítás gombra

jobs:
  run-predictor:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Run predictor
      run: |
        python run_predictions.py
